[platformio]
default_envs = nodemcuv2

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
lib_deps =
    crankyoldgit/IRremoteESP8266@^2.9.0
; HomeKit-ESP8266 已从 registry 下载到 lib/ 目录并手动打补丁（base64.h/c
; 改名 hk_base64.h/c），以消除与 ESP8266 core base64.h 的编译冲突。
